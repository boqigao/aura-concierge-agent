name: Aura Concierge AgentOps CI/CD & Evaluation Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  agentops-eval-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Pytest AgentOps Verification Suite (All 19 Rubric Criteria)
        run: |
          pytest -v

      - name: Run Golden Dataset Regression Evaluation Suite
        run: |
          python -m eval.run_eval

      - name: Deploy with Google Agents CLI (Production Branch Gate)
        if: github.ref == 'refs/heads/main' && env.ENABLE_CLOUD_DEPLOY == 'true'
        run: |
          uv tool install google-agents-cli
          agents-cli eval run
          agents-cli deploy --target cloud-run
